<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Recherche – Formations / CMQ</title>


  <!-- =====================================================
       LEAFLET
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://grist.numerique.gouv.fr/o/docs/sGx1rFGjp4oL/Carte2/p/5"
  >


  <!-- =====================================================
       STYLE
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      height: 100%;

      margin: 0;

      font-family: Arial, sans-serif;

      color: #222;

    }


    body {

      display: flex;

      flex-direction: column;

      overflow: hidden;

      background: #fff;

    }


    /* =====================================================
       BARRE SUPERIEURE
    ====================================================== */

    #top {

      padding: 10px;

      border-bottom: 1px solid #ddd;

      background: white;

      z-index: 1000;

    }


    .row {

      display: flex;

      gap: 8px;

      align-items: center;

      flex-wrap: wrap;

    }


    input,
    select,
    button {

      font: inherit;

    }


    input,
    select {

      height: 38px;

      border: 1px solid #bbb;

      border-radius: 6px;

      padding: 0 10px;

      background: white;

    }


    #mode {

      min-width: 190px;

    }


    #formation {

      flex: 2;

      min-width: 220px;

    }


    #lieu {

      flex: 1.4;

      min-width: 180px;

    }


    #distance {

      width: 115px;

    }


    #filiere {

      flex: 1;

      min-width: 150px;

    }


    #type {

      flex: 1;

      min-width: 190px;

    }


    button {

      height: 38px;

      border: 0;

      border-radius: 6px;

      padding: 0 14px;

      cursor: pointer;

      background: #2563eb;

      color: white;

      font-weight: bold;

    }


    button.secondary {

      background: #eee;

      color: #333;

    }


    #status {

      font-size: 13px;

      color: #555;

      margin-top: 7px;

    }


    /* =====================================================
       CONTENU
    ====================================================== */

    #content {

      flex: 1;

      min-height: 0;

      display: flex;

    }


    #results {

      width: 42%;

      min-width: 340px;

      overflow: auto;

      border-right: 1px solid #ddd;

      background: #fafafa;

    }


    #map {

      flex: 1;

      min-width: 0;

    }


    /* =====================================================
       RESULTATS
    ====================================================== */

    .card {

      padding: 12px;

      border-bottom: 1px solid #ddd;

      background: white;

      cursor: pointer;

    }


    .card:hover {

      background: #f3f6fb;

    }


    .card-title {

      font-weight: bold;

      margin-bottom: 5px;

      line-height: 1.3;

    }


    .meta {

      font-size: 12px;

      color: #666;

      line-height: 1.5;

    }


    .empty {

      padding: 20px;

      color: #666;

    }


    .pill {

      display: inline-block;

      padding: 3px 8px;

      border-radius: 12px;

      background: #eef2ff;

      color: #3730a3;

      font-size: 11px;

      margin: 5px 4px 0 0;

    }


    .pill.cmq {

      background: #ecfdf5;

      color: #047857;

    }


    .pill.formation {

      background: #eef2ff;

      color: #3730a3;

    }


    .popup-title {

      font-weight: bold;

      margin-bottom: 6px;

      line-height: 1.3;

    }


    .popup-line {

      font-size: 12px;

      margin: 4px 0;

    }


    .popup-type {

      display: inline-block;

      margin-top: 6px;

      padding: 3px 7px;

      border-radius: 10px;

      font-size: 11px;

      background: #eee;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      #content {

        flex-direction: column;

      }


      #results {

        width: 100%;

        height: 45%;

        min-width: 0;

        border-right: 0;

        border-bottom: 1px solid #ddd;

      }


      #map {

        height: 55%;

      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     RECHERCHE
====================================================== -->

<div id="top">

  <div class="row">


    <!-- SOURCE -->

    <select id="mode">

      <option value="all">
        Toutes les données
      </option>

      <option value="formations">
        Formations
      </option>

      <option value="cmq">
        Partenaires / CMQ
      </option>

    </select>


    <!-- RECHERCHE -->

    <input
      id="formation"
      type="search"
      placeholder="🔎 Formation, partenaire, CMQ…"
    >


    <!-- LIEU -->

    <input
      id="lieu"
      type="search"
      placeholder="📍 Ville, adresse…"
    >


    <!-- DISTANCE -->

    <select id="distance">

      <option value="0">
        Sans rayon
      </option>

      <option value="5">
        5 km
      </option>

      <option
        value="10"
        selected
      >
        10 km
      </option>

      <option value="25">
        25 km
      </option>

      <option value="50">
        50 km
      </option>

      <option value="100">
        100 km
      </option>

    </select>


    <!-- FILIERE -->

    <select id="filiere">

      <option value="">
        Toutes les filières
      </option>

    </select>


    <!-- TYPE -->

    <select id="type">

      <option value="">
        Toutes les catégories
      </option>

    </select>


    <!-- BOUTONS -->

    <button id="searchBtn">
      Rechercher
    </button>


    <button
      id="resetBtn"
      class="secondary"
    >
      Réinitialiser
    </button>


  </div>


  <div id="status">
    Chargement des données Grist…
  </div>

</div>


<!-- =====================================================
     RESULTATS + CARTE
====================================================== -->

<div id="content">


  <div id="results">

    <div class="empty">
      Chargement…
    </div>

  </div>


  <div id="map"></div>


</div>


<!-- =====================================================
     LIBRAIRIES
====================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>


<script>

(() => {

  "use strict";


  /* =====================================================
     TABLES GRIST
  ====================================================== */

  const TABLE_FORMATIONS = "Carte2_2";

  const TABLE_CMQ = "CMQ";


  /* =====================================================
     COLONNES CARTE2_2
  ====================================================== */

  const FORMATION_COL = {

    formation:
      "Nom_de_la_formation",

    partenaire:
      "Nom_du_partenaire",

    cmq:
      "Nom_du_CMQ",

    adresse:
      "adresse_du_partenaire",

    latitude:
      "LATITUDE_CARTE",

    longitude:
      "LONGITUDE_CARTE",

    filiere:
      "Filiere",

    type:
      "Categorie_etablissement",

    site:
      "Site_internet",

    afficher:
      "Afficher_sur_carte"

  };


  /* =====================================================
     COLONNES CMQ
  ====================================================== */

  const CMQ_COL = {

    formation:
      "Nom_de_la_formation",

    partenaire:
      "Nom_du_partenaire",

    cmq:
      "Nom_du_CMQ",

    adresse:
      "adresse_du_partenaire",

    latitude:
      "LATITUDE",

    longitude:
      "LONGITUDE",

    filiere:
      "Filiere",

    type:
      "Categorie_etablissement",

    site:
      "Site_internet"

  };


  /* =====================================================
     VARIABLES
  ====================================================== */

  let formations = [];

  let cmqRows = [];

  let rows = [];

  let filtered = [];

  let searchPoint = null;


  /* =====================================================
     CARTE
  ====================================================== */

  const map =

    L.map("map")
      .setView(

        [46.6, 2.4],

        6

      );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors"

    }

  ).addTo(map);


  const markers =

    L.layerGroup()
      .addTo(map);


  /* =====================================================
     OUTILS
  ====================================================== */

  const $ = id =>
    document.getElementById(id);


  function norm(value) {

    return String(value ?? "")

      .normalize("NFD")

      .replace(

        /[\u0300-\u036f]/g,

        ""

      )

      .toLowerCase()

      .trim();

  }


  function num(value) {

    if (

      value === null ||

      value === undefined ||

      value === ""

    ) {

      return NaN;

    }


    return Number(

      String(value)

        .replace(",", ".")

        .trim()

    );

  }


  function escapeHtml(value) {

    return String(value ?? "")

      .replace(

        /[&<>"']/g,

        character => ({

          "&": "&amp;",

          "<": "&lt;",

          ">": "&gt;",

          '"': "&quot;",

          "'": "&#039;"

        }[character])

      );

  }


  /* =====================================================
     DISTANCE
  ====================================================== */

  function distanceKm(

    lat1,
    lon1,
    lat2,
    lon2

  ) {

    const R = 6371;

    const p =
      Math.PI / 180;


    const x =
      (lat2 - lat1) * p;


    const y =
      (lon2 - lon1) * p;


    const h =

      Math.sin(x / 2) ** 2 +

      Math.cos(lat1 * p) *

      Math.cos(lat2 * p) *

      Math.sin(y / 2) ** 2;


    return (

      2 *

      R *

      Math.asin(

        Math.sqrt(h)

      )

    );

  }


  /* =====================================================
     NORMALISATION CARTE2_2
  ====================================================== */

  function normalizeFormation(row) {

    return {

      source:
        "formations",

      table:
        TABLE_FORMATIONS,

      id:
        row.id,

      formation:
        row[
          FORMATION_COL.formation
        ],

      partenaire:
        row[
          FORMATION_COL.partenaire
        ],

      cmq:
        row[
          FORMATION_COL.cmq
        ],

      adresse:
        row[
          FORMATION_COL.adresse
        ],

      latitude:
        row[
          FORMATION_COL.latitude
        ],

      longitude:
        row[
          FORMATION_COL.longitude
        ],

      filiere:
        row[
          FORMATION_COL.filiere
        ],

      type:
        row[
          FORMATION_COL.type
        ],

      site:
        row[
          FORMATION_COL.site
        ],

      afficher:
        row[
          FORMATION_COL.afficher
        ]

    };

  }


  /* =====================================================
     NORMALISATION CMQ
  ====================================================== */

  function normalizeCMQ(row) {

    return {

      source:
        "cmq",

      table:
        TABLE_CMQ,

      id:
        row.id,

      formation:
        row[
          CMQ_COL.formation
        ],

      partenaire:
        row[
          CMQ_COL.partenaire
        ],

      cmq:
        row[
          CMQ_COL.cmq
        ],

      adresse:
        row[
          CMQ_COL.adresse
        ],

      latitude:
        row[
          CMQ_COL.latitude
        ],

      longitude:
        row[
          CMQ_COL.longitude
        ],

      filiere:
        row[
          CMQ_COL.filiere
        ],

      type:
        row[
          CMQ_COL.type
        ],

      site:
        row[
          CMQ_COL.site
        ],

      afficher:
        true

    };

  }


  /* =====================================================
     AFFICHAGE CARTE2_2
  ====================================================== */

  function isFormationVisible(row) {

    const value =
      row.afficher;


    if (

      value === undefined ||

      value === null ||

      value === ""

    ) {

      return true;

    }


    return (

      value === true ||

      value === 1 ||

      String(value)
        .toLowerCase()
        .trim() === "true" ||

      String(value)
        .trim() === "1" ||

      String(value)
        .toLowerCase()
        .trim() === "oui"

    );

  }


  /* =====================================================
     FILTRE DE SOURCE
  ====================================================== */

  function rebuildRows() {

    const mode =
      $("mode").value;


    if (mode === "formations") {

      rows =
        formations.filter(
          isFormationVisible
        );

    }

    else if (mode === "cmq") {

      rows =
        [...cmqRows];

    }

    else {

      rows = [

        ...formations.filter(
          isFormationVisible
        ),

        ...cmqRows

      ];

    }

  }


  /* =====================================================
     FILTRES
  ====================================================== */

  function populateFilters() {

    $("filiere").innerHTML =

      '<option value="">' +

      'Toutes les filières' +

      '</option>';


    $("type").innerHTML =

      '<option value="">' +

      'Toutes les catégories' +

      '</option>';


    const filieres =

      [

        ...new Set(

          rows

            .map(
              row =>
                String(
                  row.filiere ?? ""
                ).trim()
            )

            .filter(Boolean)

        )

      ]

      .sort(
        (a, b) =>
          a.localeCompare(
            b,
            "fr"
          )
      );


    const types =

      [

        ...new Set(

          rows

            .map(
              row =>
                String(
                  row.type ?? ""
                ).trim()
            )

            .filter(Boolean)

        )

      ]

      .sort(
        (a, b) =>
          a.localeCompare(
            b,
            "fr"
          )
      );


    filieres.forEach(
      value => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          value;


        option.textContent =
          value;


        $("filiere")
          .appendChild(
            option
          );

      }
    );


    types.forEach(
      value => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          value;


        option.textContent =
          value;


        $("type")
          .appendChild(
            option
          );

      }
    );

  }


  /* =====================================================
     POPUP
  ====================================================== */

  function popup(
    row,
    distance
  ) {

    const sourceLabel =

      row.source === "formations"

        ? "Formation"

        : "Partenaire / CMQ";


    let html = "";


    html +=

      '<div class="popup-title">' +

      escapeHtml(
        row.formation ||
        row.partenaire ||
        row.cmq ||
        "Sans nom"
      ) +

      '</div>';


    html +=

      '<div class="popup-line">' +

      '<span class="popup-type">' +

      escapeHtml(
        sourceLabel
      ) +

      '</span>' +

      '</div>';


    if (
      row.partenaire
    ) {

      html +=

        '<div class="popup-line">' +

        '🏫 ' +

        escapeHtml(
          row.partenaire
        ) +

        '</div>';

    }


    if (
      row.cmq
    ) {

      html +=

        '<div class="popup-line">' +

        '🎓 ' +

        escapeHtml(
          row.cmq
        ) +

        '</div>';

    }


    if (
      row.adresse
    ) {

      html +=

        '<div class="popup-line">' +

        '📍 ' +

        escapeHtml(
          row.adresse
        ) +

        '</div>';

    }


    if (
      row.filiere
    ) {

      html +=

        '<div class="popup-line">' +

        'Filière : ' +

        escapeHtml(
          row.filiere
        ) +

        '</div>';

    }


    if (
      row.type
    ) {

      html +=

        '<div class="popup-line">' +

        'Établissement : ' +

        escapeHtml(
          row.type
        ) +

        '</div>';

    }


    if (
      distance !== null
    ) {

      html +=

        '<div class="popup-line">' +

        '📏 ' +

        distance.toFixed(1) +

        ' km' +

        '</div>';

    }


    if (
      row.site
    ) {

      html +=

        '<div class="popup-line">' +

        '🌐 ' +

        '<a href="' +

        escapeHtml(
          String(row.site)
        ) +

        '" target="_blank" rel="noopener">' +

        'Site internet' +

        '</a>' +

        '</div>';

    }


    return html;

  }


  /* =====================================================
     SELECTION DANS GRIST
  ====================================================== */

  async function selectRow(row) {

    try {

      await grist.setCursorPos({

        tableId:
          row.table,

        rowId:
          row.id

      });

    }

    catch (error) {

      console.error(

        "Impossible de sélectionner la ligne Grist",

        error

      );

    }

  }


  /* =====================================================
     RENDU
  ====================================================== */

  function render() {

    markers.clearLayers();


    const list =
      $("results");


    list.innerHTML = "";


    const bounds = [];


    filtered.forEach(
      row => {

        const lat =
          num(row.latitude);


        const lon =
          num(row.longitude);


        let distance =
          null;


        if (

          searchPoint &&

          Number.isFinite(lat) &&

          Number.isFinite(lon)

        ) {

          distance =

            distanceKm(

              searchPoint[0],

              searchPoint[1],

              lat,

              lon

            );

        }


        /* ===============================================
           MARQUEUR
        ================================================ */

        if (

          Number.isFinite(lat) &&

          Number.isFinite(lon)

        ) {

          const marker =

            L.marker([

              lat,

              lon

            ]);


          marker.bindPopup(

            popup(
              row,
              distance
            )

          );


          marker.on(

            "click",

            () => {

              selectRow(row);

            }

          );


          marker.addTo(
            markers
          );


          bounds.push([

            lat,

            lon

          ]);

        }


        /* ===============================================
           CARTE RESULTAT
        ================================================ */

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card";


        let html = "";


        const title =

          row.source === "formations"

            ? row.formation

            : (

                row.partenaire ||

                row.cmq ||

                row.formation

              );


        html +=

          '<div class="card-title">' +

          escapeHtml(
            title
          ) +

          '</div>';


        html +=

          '<div class="meta">';


        if (
          row.source === "formations"
        ) {

          html +=

            '<b>Formation</b>';


          if (
            row.partenaire
          ) {

            html +=

              '<br>🏫 ' +

              escapeHtml(
                row.partenaire
              );

          }

        }

        else {

          html +=

            '<b>Partenaire / CMQ</b>';


          if (
            row.cmq
          ) {

            html +=

              '<br>🎓 ' +

              escapeHtml(
                row.cmq
              );

          }

        }


        if (
          row.adresse
        ) {

          html +=

            '<br>📍 ' +

            escapeHtml(
              row.adresse
            );

        }


        if (
          distance !== null
        ) {

          html +=

            '<br>📏 ' +

            distance.toFixed(1) +

            ' km';

        }


        html +=
          '</div>';


        /* =============================================
           PILL SOURCE
        ============================================== */

        if (
          row.source === "formations"
        ) {

          html +=

            '<span class="pill formation">' +

            'Formation' +

            '</span>';

        }

        else {

          html +=

            '<span class="pill cmq">' +

            'Partenaire / CMQ' +

            '</span>';

        }


        if (
          row.filiere
        ) {

          html +=

            '<span class="pill">' +

            escapeHtml(
              row.filiere
            ) +

            '</span>';

        }


        if (
          row.type
        ) {

          html +=

            '<span class="pill">' +

            escapeHtml(
              row.type
            ) +

            '</span>';

        }


        card.innerHTML =
          html;


        card.onclick = () => {

          if (

            Number.isFinite(lat) &&

            Number.isFinite(lon)

          ) {

            map.setView(

              [lat, lon],

              15

            );

          }


          selectRow(row);

        };


        list.appendChild(
          card
        );

      }

    );


    /* =================================================
       AUCUN RESULTAT
    ================================================== */

    if (
      !filtered.length
    ) {

      list.innerHTML =

        '<div class="empty">' +

        'Aucun résultat ne correspond à votre recherche.' +

        '</div>';

    }


    /* =================================================
       ZOOM AUTOMATIQUE
    ================================================== */

    if (

      bounds.length &&

      !searchPoint

    ) {

      map.fitBounds(

        bounds,

        {

          padding: [
            20,
            20
          ]

        }

      );

    }


    /* =================================================
       STATUT
    ================================================== */

    let label =
      "résultat";


    if (
      filtered.length > 1
    ) {

      label =
        "résultats";

    }


    $("status").textContent =

      filtered.length +

      " " +

      label +

      " affiché" +

      (

        filtered.length > 1
          ? "s"
          : ""

      );

  }


  /* =====================================================
     RECHERCHE GEOGRAPHIQUE
  ====================================================== */

  async function geocode() {

    const query =
      $("lieu").value.trim();


    if (!query) {

      searchPoint = null;

      return true;

    }


    $("status").textContent =

      "Recherche de « " +

      query +

      " »…";


    const url =

      "https://nominatim.openstreetmap.org/search" +

      "?format=jsonv2" +

      "&limit=1" +

      "&countrycodes=fr" +

      "&q=" +

      encodeURIComponent(
        query
      );


    try {

      const response =

        await fetch(

          url,

          {

            headers: {

              "Accept":
                "application/json"

            }

          }

        );


      if (
        !response.ok
      ) {

        throw new Error(

          "Erreur HTTP " +

          response.status

        );

      }


      const data =
        await response.json();


      if (
        !data.length
      ) {

        alert(
          "Lieu introuvable."
        );

        return false;

      }


      searchPoint = [

        Number(
          data[0].lat
        ),

        Number(
          data[0].lon
        )

      ];


      map.setView(

        searchPoint,

        12

      );


      return true;

    }

    catch (error) {

      console.error(
        error
      );


      alert(

        "Impossible de rechercher ce lieu."

      );


      return false;

    }

  }


  /* =====================================================
     RECHERCHE PRINCIPALE
  ====================================================== */

  async function search() {

    const ok =
      await geocode();


    if (!ok) {

      return;

    }


    const query =

      norm(
        $("formation").value
      );


    const filiere =

      norm(
        $("filiere").value
      );


    const type =

      norm(
        $("type").value
      );


    const radius =

      num(
        $("distance").value
      );


    filtered =

      rows.filter(
        row => {


          /* ============================================
             TEXTE
          ============================================= */

          const text =

            norm([

              row.formation,

              row.partenaire,

              row.cmq,

              row.adresse,

              row.filiere,

              row.type

            ].join(" "));


          if (

            query &&

            !text.includes(
              query
            )

          ) {

            return false;

          }


          /* ============================================
             FILIERE
          ============================================= */

          if (

            filiere &&

            norm(
              row.filiere
            ) !== filiere

          ) {

            return false;

          }


          /* ============================================
             TYPE
          ============================================= */

          if (

            type &&

            norm(
              row.type
            ) !== type

          ) {

            return false;

          }


          /* ============================================
             RAYON
          ============================================= */

          if (

            searchPoint &&

            radius > 0

          ) {

            const lat =
              num(
                row.latitude
              );


            const lon =
              num(
                row.longitude
              );


            if (

              !Number.isFinite(lat) ||

              !Number.isFinite(lon)

            ) {

              return false;

            }


            const distance =

              distanceKm(

                searchPoint[0],

                searchPoint[1],

                lat,

                lon

              );


            if (

              distance > radius

            ) {

              return false;

            }

          }


          return true;

        }

      );


    render();

  }


  /* =====================================================
     RESET
  ====================================================== */

  function reset() {

    $("formation").value =
      "";


    $("lieu").value =
      "";


    $("filiere").value =
      "";


    $("type").value =
      "";


    $("distance").value =
      "10";


    searchPoint =
      null;


    rebuildRows();


    populateFilters();


    filtered =
      [...rows];


    render();

  }


  /* =====================================================
     CHANGEMENT DE SOURCE
  ====================================================== */

  $("mode").addEventListener(

    "change",

    () => {

      rebuildRows();

      populateFilters();

      search();

    }

  );


  /* =====================================================
     EVENEMENTS
  ====================================================== */

  $("searchBtn").onclick =
    search;


  $("resetBtn").onclick =
    reset;


  [
    "formation",
    "lieu"
  ]

  .forEach(
    id => {

      $(id).addEventListener(

        "keydown",

        event => {

          if (
            event.key === "Enter"
          ) {

            search();

          }

        }

      );

    }
  );


  [
    "filiere",
    "type",
    "distance"
  ]

  .forEach(
    id => {

      $(id).addEventListener(

        "change",

        search

      );

    }
  );


  /* =====================================================
     CHARGEMENT DES DEUX TABLES GRIST
  ====================================================== */

  async function loadData() {

    try {

      $("status").textContent =

        "Chargement de Carte2_2 et CMQ…";


      /* ===============================================
         TABLE FORMATIONS
      ================================================ */

      const formationTable =

        await grist.docApi.fetchTable(

          TABLE_FORMATIONS

        );


      const formationIds =

        formationTable.id || [];


      formations =

        formationIds.map(

          (id, index) => {

            const row = {

              id:
                id

            };


            Object.keys(
              formationTable
            ).forEach(

              column => {

                if (
                  column !== "id"
                ) {

                  row[column] =

                    formationTable[
                      column
                    ][index];

                }

              }

            );


            return normalizeFormation(
              row
            );

          }

        );


      /* ===============================================
         TABLE CMQ
      ================================================ */

      const cmqTable =

        await grist.docApi.fetchTable(

          TABLE_CMQ

        );


      const cmqIds =

        cmqTable.id || [];


      cmqRows =

        cmqIds.map(

          (id, index) => {

            const row = {

              id:
                id

            };


            Object.keys(
              cmqTable
            ).forEach(

              column => {

                if (
                  column !== "id"
                ) {

                  row[column] =

                    cmqTable[
                      column
                    ][index];

                }

              }

            );


            return normalizeCMQ(
              row
            );

          }

        );


      /* ===============================================
         INITIALISATION
      ================================================ */

      rebuildRows();


      populateFilters();


      filtered =
        [...rows];


      render();


      $("status").textContent =

        formations.length +

        " formations + " +

        cmqRows.length +

        " partenaires / CMQ";


    }

    catch (error) {

      console.error(
        error
      );


      $("status").textContent =

        "Erreur de chargement : " +

        error.message;


      $("results").innerHTML =

        '<div class="empty">' +

        '<b>Impossible de charger les données.</b>' +

        '<br><br>' +

        escapeHtml(
          error.message
        ) +

        '</div>';

    }

  }


  /* =====================================================
     INITIALISATION GRIST
  ====================================================== */

  grist.ready({

    requiredAccess:
      "full",

    allowSelectBy:
      true

  });


  /* =====================================================
     LANCEMENT
  ====================================================== */

  loadData();


})();

</script>
