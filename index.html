<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Widget CMQ</title>

    <style>

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        #status {
            padding: 10px;
            background: #f3f4f6;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        #results {
            width: 100%;
        }

        .row {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .title {
            font-weight: bold;
        }

        .info {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }

    </style>
</head>

<body>

<div id="status">
    En attente de la sélection du CMQ...
</div>

<div id="results"></div>


<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

let records = [];


/*
============================================================
GRIST
============================================================
*/

grist.ready({

    allowSelectBy: true,

    requiredAccess: "read table"

});


/*
============================================================
RECEPTION DES DONNEES
============================================================
*/

grist.onRecords(function(data) {

    console.log(
        "Données reçues de Grist :",
        data
    );

    records = data || [];

    afficher();

});


/*
============================================================
AFFICHAGE
============================================================
*/

function afficher() {

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");


    results.innerHTML = "";


    if (!records.length) {

        status.textContent =
            "Aucune donnée sélectionnée.";

        return;

    }


    status.textContent =
        records.length +
        " ligne(s) reçue(s) de Grist.";


    records.forEach(function(row) {

        const element =
            document.createElement("div");

        element.className = "row";


        /*
        On utilise les données EXISTANTES
        envoyées par Grist.
        */

        const formation =
            row["Nom de la formation"] || "";


        const partenaire =
            row["Nom du partenaire"] || "";


        const adresse =
            row["adresse du partenaire"] || "";


        const filiere =
            row["Filiére"] || "";


        const cmq =
            row["Nom du CMQ"] || "";


        element.innerHTML = `

            <div class="title">
                ${escapeHtml(formation)}
            </div>

            <div class="info">
                ${escapeHtml(partenaire)}
            </div>

            <div class="info">
                ${escapeHtml(adresse)}
            </div>

            <div class="info">
                ${escapeHtml(filiere)}
            </div>

            <div class="info">
                CMQ : ${escapeHtml(cmq)}
            </div>

        `;


        /*
        Cliquer sur une ligne sélectionne
        la ligne correspondante dans Grist.
        */

        element.addEventListener(
            "click",
            function() {

                if (!row.id) {
                    return;
                }

                grist.setCursorPos({
                    rowId: row.id
                });

            }
        );


        results.appendChild(element);

    });

}


/*
============================================================
SECURITE HTML
============================================================
*/

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/[&<>"']/g, function(char) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[char];

        });

}

</script>

</body>
</html>
