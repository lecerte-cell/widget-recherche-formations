<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Recherche de formations – Grist</title>


  <!-- =====================================================
       LEAFLET
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <!-- =====================================================
       STYLE
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      height: 100%;

      margin: 0;

      font-family: Arial, sans-serif;

      color: #222;

    }


    body {

      display: flex;

      flex-direction: column;

      overflow: hidden;

    }


    /* =====================================================
       BARRE DE RECHERCHE
    ====================================================== */

    #top {

      padding: 10px;

      border-bottom: 1px solid #ddd;

      background: white;

    }


    .row {

      display: flex;

      gap: 8px;

      align-items: center;

      flex-wrap: wrap;

    }


    input,
    select,
    button {

      font: inherit;

    }


    input,
    select {

      height: 38px;

      border: 1px solid #bbb;

      border-radius: 6px;

      padding: 0 10px;

      background: white;

    }


    #formation {

      flex: 2;

      min-width: 220px;

    }


    #lieu {

      flex: 1.4;

      min-width: 180px;

    }


    #filiere {

      flex: 1;

      min-width: 150px;

    }


    #type {

      flex: 1;

      min-width: 170px;

    }


    #distance {

      width: 115px;

    }


    button {

      height: 38px;

      border: 0;

      border-radius: 6px;

      padding: 0 14px;

      cursor: pointer;

      background: #2563eb;

      color: white;

      font-weight: bold;

    }


    button.secondary {

      background: #eee;

      color: #333;

    }


    #status {

      font-size: 13px;

      color: #555;

      margin-top: 7px;

    }


    /* =====================================================
       CONTENU
    ====================================================== */

    #content {

      flex: 1;

      min-height: 0;

      display: flex;

    }


    #results {

      width: 42%;

      min-width: 330px;

      overflow: auto;

      border-right: 1px solid #ddd;

      background: #fafafa;

    }


    #map {

      flex: 1;

      min-width: 0;

    }


    /* =====================================================
       RESULTATS
    ====================================================== */

    .card {

      padding: 12px;

      border-bottom: 1px solid #ddd;

      background: white;

      cursor: pointer;

    }


    .card:hover {

      background: #f3f6fb;

    }


    .title {

      font-weight: bold;

      margin-bottom: 5px;

    }


    .meta {

      font-size: 12px;

      color: #666;

      line-height: 1.45;

    }


    .empty {

      padding: 20px;

      color: #666;

    }


    .pill {

      display: inline-block;

      padding: 2px 7px;

      border-radius: 12px;

      background: #eef2ff;

      color: #3730a3;

      font-size: 11px;

      margin: 4px 3px 0 0;

    }


    .popup-title {

      font-weight: bold;

      margin-bottom: 5px;

    }


    .popup-line {

      font-size: 12px;

      margin: 3px 0;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      #content {

        flex-direction: column;

      }


      #results {

        width: 100%;

        height: 42%;

        border-right: 0;

        border-bottom: 1px solid #ddd;

      }


      #map {

        height: 58%;

      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     BARRE DE RECHERCHE
====================================================== -->

<div id="top">

  <div class="row">

    <input
      id="formation"
      type="search"
      placeholder="🔎 Formation, mot-clé…"
    >


    <input
      id="lieu"
      type="search"
      placeholder="📍 Ville, adresse…"
    >


    <select id="distance">

      <option value="0">
        Sans rayon
      </option>

      <option value="5">
        5 km
      </option>

      <option
        value="10"
        selected
      >
        10 km
      </option>

      <option value="25">
        25 km
      </option>

      <option value="50">
        50 km
      </option>

      <option value="100">
        100 km
      </option>

    </select>


    <select id="filiere">

      <option value="">
        Toutes les filières
      </option>

    </select>


    <select id="type">

      <option value="">
        Tous les établissements
      </option>

    </select>


    <button id="searchBtn">
      Rechercher
    </button>


    <button
      id="resetBtn"
      class="secondary"
    >
      Réinitialiser
    </button>

  </div>


  <div id="status">
    Connexion aux données Grist…
  </div>

</div>


<!-- =====================================================
     RESULTATS + CARTE
====================================================== -->

<div id="content">

  <div id="results">

    <div class="empty">
      Chargement des formations…
    </div>

  </div>


  <div id="map"></div>

</div>


<!-- =====================================================
     LIBRAIRIES
====================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>


<script>

(() => {

  "use strict";


  /* =====================================================
     CONFIGURATION DU WIDGET GRIST
     
     Ces noms sont les noms INTERNES utilisés par le code.
     Grist permettra de choisir les vraies colonnes.
  ====================================================== */

  const COLUMN_CONFIG = [

    {
      name: "formation",
      title: "Formation",
      optional: false
    },

    {
      name: "filiere",
      title: "Filière",
      optional: true
    },

    {
      name: "partenaire",
      title: "Nom du partenaire",
      optional: true
    },

    {
      name: "cmq",
      title: "Nom du CMQ",
      optional: true
    },

    {
      name: "type",
      title: "Catégorie établissement",
      optional: true
    },

    {
      name: "adresse",
      title: "Adresse",
      optional: true
    },

    {
      name: "latitude",
      title: "Latitude",
      optional: false
    },

    {
      name: "longitude",
      title: "Longitude",
      optional: false
    },

    {
      name: "site",
      title: "Site internet",
      optional: true
    },

    {
      name: "afficher",
      title: "Afficher sur carte",
      optional: true
    }

  ];


  /* =====================================================
     VARIABLES
  ====================================================== */

  let rows = [];

  let filtered = [];

  let searchPoint = null;

  let mappings = null;


  /* =====================================================
     CARTE
  ====================================================== */

  const map =

    L.map("map")
      .setView(
        [46.6, 2.4],
        6
      );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors"

    }

  ).addTo(map);


  const markers =
    L.layerGroup().addTo(map);


  /* =====================================================
     OUTILS
  ====================================================== */

  const $ = id =>
    document.getElementById(id);


  function norm(value) {

    return String(value ?? "")

      .normalize("NFD")

      .replace(
        /[\u0300-\u036f]/g,
        ""
      )

      .toLowerCase()

      .trim();

  }


  function num(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return NaN;

    }


    return Number(

      String(value)

        .replace(",", ".")

        .trim()

    );

  }


  function distanceKm(

    lat1,
    lon1,
    lat2,
    lon2

  ) {

    const R = 6371;

    const p =
      Math.PI / 180;


    const x =
      (lat2 - lat1) * p;


    const y =
      (lon2 - lon1) * p;


    const h =

      Math.sin(x / 2) ** 2 +

      Math.cos(lat1 * p) *

      Math.cos(lat2 * p) *

      Math.sin(y / 2) ** 2;


    return (

      2 *

      R *

      Math.asin(
        Math.sqrt(h)
      )

    );

  }


  function escapeHtml(value) {

    return String(value ?? "")

      .replace(

        /[&<>"']/g,

        character => ({

          "&": "&amp;",

          "<": "&lt;",

          ">": "&gt;",

          '"': "&quot;",

          "'": "&#039;"

        }[character])

      );

  }


  /* =====================================================
     RECUPERATION D'UNE COLONNE MAPPÉE
  ====================================================== */

  function mappedValue(row, name) {

    if (!row) {

      return "";

    }


    /*
      Si Grist nous donne un mapping,
      on utilise le vrai nom de colonne.
    */

    const realColumn =
      mappings &&
      mappings[name];


    if (
      realColumn &&
      typeof realColumn === "string"
    ) {

      return row[realColumn];

    }


    /*
      Fallback :
      si le mapping n'est pas encore disponible,
      on tente le nom logique.
    */

    return row[name];

  }


  /* =====================================================
     NORMALISATION DES LIGNES
  ====================================================== */

  function normalizeRows(records, columnMappings) {

    mappings =
      columnMappings || null;


    return records.map(record => {

      return {

        id: record.id,

        formation:
          mappedValue(
            record,
            "formation"
          ),

        filiere:
          mappedValue(
            record,
            "filiere"
          ),

        partenaire:
          mappedValue(
            record,
            "partenaire"
          ),

        cmq:
          mappedValue(
            record,
            "cmq"
          ),

        type:
          mappedValue(
            record,
            "type"
          ),

        adresse:
          mappedValue(
            record,
            "adresse"
          ),

        latitude:
          mappedValue(
            record,
            "latitude"
          ),

        longitude:
          mappedValue(
            record,
            "longitude"
          ),

        site:
          mappedValue(
            record,
            "site"
          ),

        afficher:
          mappedValue(
            record,
            "afficher"
          )

      };

    });

  }


  /* =====================================================
     AFFICHAGE SUR CARTE
  ====================================================== */

  function isVisible(row) {

    const value =
      row.afficher;


    /*
      Si la colonne "Afficher sur carte"
      n'est pas renseignée, on affiche.
    */

    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {

      return true;

    }


    return (

      value === true ||

      value === 1 ||

      String(value)
        .toLowerCase()
        .trim() === "true" ||

      String(value)
        .trim() === "1" ||

      String(value)
        .toLowerCase()
        .trim() === "oui"

    );

  }


  /* =====================================================
     FORMATION EXISTANTE
  ====================================================== */

  function hasFormation(row) {

    return (

      String(
        row.formation ?? ""
      ).trim() !== ""

    );

  }


  /* =====================================================
     FILTRES
  ====================================================== */

  function populateFilters() {

    /*
      On vide d'abord les anciennes options.
      Cela évite les doublons lorsque Grist
      actualise les données.
    */

    $("filiere").innerHTML =

      '<option value="">' +

      'Toutes les filières' +

      '</option>';


    $("type").innerHTML =

      '<option value="">' +

      'Tous les établissements' +

      '</option>';


    const filieres =

      [

        ...new Set(

          rows

            .map(
              r =>
                String(
                  r.filiere ?? ""
                ).trim()
            )

            .filter(Boolean)

        )

      ]

      .sort(
        (a, b) =>
          a.localeCompare(
            b,
            "fr"
          )
      );


    const types =

      [

        ...new Set(

          rows

            .map(
              r =>
                String(
                  r.type ?? ""
                ).trim()
            )

            .filter(Boolean)

        )

      ]

      .sort(
        (a, b) =>
          a.localeCompare(
            b,
            "fr"
          )
      );


    for (
      const value of filieres
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        value;


      option.textContent =
        value;


      $("filiere")
        .appendChild(option);

    }


    for (
      const value of types
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        value;


      option.textContent =
        value;


      $("type")
        .appendChild(option);

    }

  }


  /* =====================================================
     POPUP
  ====================================================== */

  function popup(
    row,
    distance
  ) {

    let site = "";


    if (
      row.site
    ) {

      const url =
        String(row.site);


      site =

        '<div class="popup-line">' +

        '🌐 ' +

        '<a href="' +

        escapeHtml(url) +

        '" target="_blank" rel="noopener">' +

        'Site internet' +

        '</a>' +

        '</div>';

    }


    return

      '<div class="popup-title">' +

      escapeHtml(
        row.formation
      ) +

      '</div>' +


      (

        row.partenaire

          ?

          '<div class="popup-line">' +

          '🏫 ' +

          escapeHtml(
            row.partenaire
          ) +

          '</div>'

          :

          ""

      ) +


      (

        row.adresse

          ?

          '<div class="popup-line">' +

          '📍 ' +

          escapeHtml(
            row.adresse
          ) +

          '</div>'

          :

          ""

      ) +


      (

        row.cmq

          ?

          '<div class="popup-line">' +

          '🎓 ' +

          escapeHtml(
            row.cmq
          ) +

          '</div>'

          :

          ""

      ) +


      (

        row.filiere

          ?

          '<div class="popup-line">' +

          'Filière : ' +

          escapeHtml(
            row.filiere
          ) +

          '</div>'

          :

          ""

      ) +


      (

        row.type

          ?

          '<div class="popup-line">' +

          'Établissement : ' +

          escapeHtml(
            row.type
          ) +

          '</div>'

          :

          ""

      ) +


      (

        distance !== null

          ?

          '<div class="popup-line">' +

          '📏 ' +

          distance.toFixed(1) +

          ' km' +

          '</div>'

          :

          ""

      ) +


      site;

  }


  /* =====================================================
     SELECTION DANS GRIST
  ====================================================== */

  async function selectRow(row) {

    try {

      if (
        row &&
        row.id !== undefined
      ) {

        await grist.setCursorPos({

          rowId: row.id

        });

      }

    }

    catch (error) {

      console.error(

        "Impossible de sélectionner la ligne Grist",

        error

      );

    }

  }


  /* =====================================================
     AFFICHAGE
  ====================================================== */

  function render() {

    markers.clearLayers();


    const bounds = [];


    const list =
      $("results");


    list.innerHTML = "";


    /* ---------------------------------------------------
       RESULTATS
    --------------------------------------------------- */

    filtered.forEach(row => {

      const lat =
        num(row.latitude);


      const lon =
        num(row.longitude);


      let distance = null;


      if (

        searchPoint &&

        Number.isFinite(lat) &&

        Number.isFinite(lon)

      ) {

        distance =

          distanceKm(

            searchPoint[0],

            searchPoint[1],

            lat,

            lon

          );

      }


      /* -------------------------------------------------
         MARQUEUR
      ------------------------------------------------- */

      if (

        Number.isFinite(lat) &&

        Number.isFinite(lon)

      ) {

        const marker =

          L.marker([

            lat,

            lon

          ]);


        marker.bindPopup(

          popup(
            row,
            distance
          )

        );


        marker.on(

          "click",

          () =>
            selectRow(row)

        );


        marker.addTo(
          markers
        );


        bounds.push([

          lat,

          lon

        ]);

      }


      /* -------------------------------------------------
         CARTE RESULTAT
      ------------------------------------------------- */

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      let html = "";


      html +=

        '<div class="title">' +

        escapeHtml(
          row.formation
        ) +

        '</div>';


      html +=

        '<div class="meta">';


      if (
        row.partenaire
      ) {

        html +=

          '<b>' +

          escapeHtml(
            row.partenaire
          ) +

          '</b>';

      }


      if (
        row.adresse
      ) {

        html +=

          '<br>' +

          escapeHtml(
            row.adresse
          );

      }


      if (
        row.cmq
      ) {

        html +=

          '<br>' +

          escapeHtml(
            row.cmq
          );

      }


      if (
        distance !== null
      ) {

        html +=

          '<br>📏 ' +

          distance.toFixed(1) +

          ' km';

      }


      html +=
        '</div>';


      if (
        row.filiere
      ) {

        html +=

          '<span class="pill">' +

          escapeHtml(
            row.filiere
          ) +

          '</span>';

      }


      if (
        row.type
      ) {

        html +=

          '<span class="pill">' +

          escapeHtml(
            row.type
          ) +

          '</span>';

      }


      card.innerHTML =
        html;


      card.onclick = () => {

        if (

          Number.isFinite(lat) &&

          Number.isFinite(lon)

        ) {

          map.setView(

            [lat, lon],

            15

          );

        }


        selectRow(row);

      };


      list.appendChild(
        card
      );

    });


    /* -------------------------------------------------
       AUCUN RESULTAT
    ------------------------------------------------- */

    if (
      !filtered.length
    ) {

      list.innerHTML =

        '<div class="empty">' +

        'Aucune formation ne correspond à votre recherche.' +

        '</div>';

    }


    /* -------------------------------------------------
       ZOOM
    ------------------------------------------------- */

    if (

      bounds.length &&

      !searchPoint

    ) {

      map.fitBounds(

        bounds,

        {

          padding: [
            20,
            20
          ]

        }

      );

    }


    /* -------------------------------------------------
       STATUT
    ------------------------------------------------- */

    $("status").textContent =

      filtered.length +

      " formation" +

      (

        filtered.length > 1

          ? "s"

          : ""

      ) +

      " trouvée" +

      (

        filtered.length > 1

          ? "s"

          : ""

      );

  }


  /* =====================================================
     GEOCODAGE
  ====================================================== */

  async function geocode() {

    const query =
      $("lieu").value.trim();


    if (!query) {

      searchPoint = null;

      return true;

    }


    $("status").textContent =

      "Recherche de « " +

      query +

      " »…";


    const url =

      "https://nominatim.openstreetmap.org/search" +

      "?format=jsonv2" +

      "&limit=1" +

      "&countrycodes=fr" +

      "&q=" +

      encodeURIComponent(
        query
      );


    try {

      const response =
        await fetch(

          url,

          {

            headers: {

              "Accept":
                "application/json"

            }

          }

        );


      if (
        !response.ok
      ) {

        throw new Error(
          "Erreur HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if (
        !data.length
      ) {

        alert(
          "Lieu introuvable."
        );

        return false;

      }


      searchPoint = [

        Number(
          data[0].lat
        ),

        Number(
          data[0].lon
        )

      ];


      map.setView(

        searchPoint,

        12

      );


      return true;

    }

    catch (error) {

      console.error(
        error
      );


      alert(

        "Impossible de rechercher ce lieu."

      );


      return false;

    }

  }


  /* =====================================================
     RECHERCHE PRINCIPALE
  ====================================================== */

  async function search() {

    const ok =
      await geocode();


    if (!ok) {

      return;

    }


    const query =
      norm(
        $("formation").value
      );


    const filiere =
      norm(
        $("filiere").value
      );


    const type =
      norm(
        $("type").value
      );


    const radius =
      num(
        $("distance").value
      );


    filtered =

      rows.filter(row => {


        /* ------------------------------------------------
           FORMATION
        ------------------------------------------------ */

        if (
          !hasFormation(row)
        ) {

          return false;

        }


        /* ------------------------------------------------
           AFFICHAGE
        ------------------------------------------------ */

        if (
          !isVisible(row)
        ) {

          return false;

        }


        /* ------------------------------------------------
           RECHERCHE TEXTE
        ------------------------------------------------ */

        const text =

          norm([

            row.formation,

            row.partenaire,

            row.filiere,

            row.cmq,

            row.adresse,

            row.type

          ].join(" "));


        if (

          query &&

          !text.includes(
            query
          )

        ) {

          return false;

        }


        /* ------------------------------------------------
           FILIERE
        ------------------------------------------------ */

        if (

          filiere &&

          norm(
            row.filiere
          ) !== filiere

        ) {

          return false;

        }


        /* ------------------------------------------------
           TYPE
        ------------------------------------------------ */

        if (

          type &&

          norm(
            row.type
          ) !== type

        ) {

          return false;

        }


        /* ------------------------------------------------
           RAYON
        ------------------------------------------------ */

        if (

          searchPoint &&

          radius > 0

        ) {

          const lat =
            num(
              row.latitude
            );


          const lon =
            num(
              row.longitude
            );


          if (

            !Number.isFinite(lat) ||

            !Number.isFinite(lon)

          ) {

            return false;

          }


          const distance =

            distanceKm(

              searchPoint[0],

              searchPoint[1],

              lat,

              lon

            );


          if (
            distance > radius
          ) {

            return false;

          }

        }


        return true;

      });


    render();

  }


  /* =====================================================
     RESET
  ====================================================== */

  function reset() {

    $("formation").value =
      "";


    $("lieu").value =
      "";


    $("filiere").value =
      "";


    $("type").value =
      "";


    $("distance").value =
      "10";


    searchPoint =
      null;


    filtered =

      rows.filter(

        row =>

          hasFormation(row) &&

          isVisible(row)

      );


    render();

  }


  /* =====================================================
     RECEPTION DES DONNEES GRIST
     
     C'EST ICI QUE LE WIDGET UTILISE
     LA SOURCE DE DONNEES CONFIGUREE DANS GRIST.
  ====================================================== */

  grist.onRecords(

    function(
      records,
      columnMappings
    ) {

      try {

        console.log(
          "Données reçues de Grist :",
          records
        );


        console.log(
          "Mapping des colonnes :",
          columnMappings
        );


        rows =

          normalizeRows(

            records,

            columnMappings

          );


        populateFilters();


        filtered =

          rows.filter(

            row =>

              hasFormation(row) &&

              isVisible(row)

          );


        render();


      }

      catch (error) {

        console.error(

          "Erreur lors du chargement des données Grist :",

          error

        );


        $("status").textContent =

          "Erreur : " +

          error.message;


        $("results").innerHTML =

          '<div class="empty">' +

          'Impossible de charger les données Grist.' +

          '</div>';

      }

    }

  );


  /* =====================================================
     EVENEMENTS
  ====================================================== */

  $("searchBtn")
    .onclick = search;


  $("resetBtn")
    .onclick = reset;


  [
    "formation",
    "lieu"
  ]

  .forEach(id => {

    $(id).addEventListener(

      "keydown",

      event => {

        if (
          event.key === "Enter"
        ) {

          search();

        }

      }

    );

  });


  [
    "filiere",
    "type",
    "distance"
  ]

  .forEach(id => {

    $(id).addEventListener(

      "change",

      search

    );

  });


  /* =====================================================
     INITIALISATION GRIST
  ====================================================== */

  grist.ready({

    requiredAccess:
      "read table",

    allowSelectBy:
      true,

    columns:
      COLUMN_CONFIG

  });


})();

</script>

</body>

</html>
